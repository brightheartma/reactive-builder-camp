[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@reactive/=lib/reactive-lib-omni/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
lasna = "https://lasna-rpc.rnk.dev/"
